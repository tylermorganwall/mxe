name: Windows Build

on:
  push:
    branches: [ oidn ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            git
            autoconf
            automake-wrapper
            gettext-devel
            bison
            flex
            gperf
            intltool
            libtool
            lzip
            make
            cmake
            openssl
            p7zip
            patch
            perl
            pkgconf
            python
            python-mako
            python-packaging
            python-setuptools
            ruby
            unzip
            wget
            xz
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gdk-pixbuf2

      - name: Build MXE toolchain
        shell: msys2 {0}
        env:
          MXE_USE_CCACHE: ""
          CCACHE_DISABLE: "1"
          OS_SHORT_NAME: disable-native-plugins
        run: |
          set -e

          # Patch MXE gmp package to skip native BUILD target, which fails under MSYS2/UCRT64.
          # After this, gmp will only be built for MXE_TARGETS (x86_64-w64-mingw32.shared).
          if [ -f src/gmp.mk ]; then
            sed -i 's/^$(PKG)_TARGETS.*/$(PKG)_TARGETS := $(MXE_TARGETS)/' src/gmp.mk
          fi

          rm -rf .ccache
          make check-requirements
          make MXE_TARGETS='x86_64-w64-mingw32.shared' JOBS=2 MXE_USE_CCACHE= CCACHE_DISABLE=1 cc

      - name: Run smoke tests
        shell: msys2 {0}
        env:
          MXE_USE_CCACHE: ""
          CCACHE_DISABLE: "1"
          OS_SHORT_NAME: disable-native-plugins
        run: |
          make MXE_TARGETS='x86_64-w64-mingw32.shared' JOBS=2 MXE_USE_CCACHE= CCACHE_DISABLE=1 cmake

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mxe-windows-logs
          if-no-files-found: warn
          path: |
            log/**
            settings.mk
            usr/**/config.log
            tmp-**/config.log
            tmp-**/**/config.log
            tmp-**/**/*.log
